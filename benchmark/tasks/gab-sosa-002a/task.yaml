schema_version: "0.1"
id: gab-sosa-002a
title: Clip a river network to municipalities, preserving the input CRS
category: vector
prompt: >
  inputs/rivers.geojson holds 593 river centrelines in EPSG:4326 and
  inputs/municipalities.geojson holds four Pärnu county municipalities in EPSG:3301. Two of
  the four municipality geometries are invalid: each carries an extra part whose ring
  touches itself. Repair them before you use them; every area-preserving repair
  (make_valid, a zero-width buffer, a self-union) gives the same region here, and dropping
  the invalid features is not a repair.

  Clip the rivers to the union of the four repaired municipality polygons, doing the
  geometry work in EPSG:3301. Keep one feature per input river that still has a non-empty
  clipped part, carrying the fields source_fid and name from the input; rivers that fall
  entirely outside the municipalities are not in the output.

  Write the result to rivers_clipped.gpkg **in the same coordinate reference system as the
  input river layer**, not in the CRS you did the analysis in.

inputs:
  - path: inputs/rivers.geojson
    role: rivers
    source: "OpenStreetMap via Overpass API; way[waterway=river] in bbox 58.10,23.90,58.95,25.30, simplified at 5 m, kept within 2000 m of the four municipalities"
    as_of: "2026-09-02"
    checksum: sha256:091186cb02b22458c0ffedf7ce659bfb462e493db91624a9846ef12ccafea200
    license: ODbL-1.0
  - path: inputs/municipalities.geojson
    role: municipalities
    source: "Maa-amet Haldus- ja asustusjaotus, omavalitsus layer (https://geoportaal.maaamet.ee/docs/haldus_asustus/omavalitsus_shp.zip), four Pärnu county municipalities, generalised at 50 m, two carrying a deliberate topology defect (see inputs/README.md)"
    as_of: "2024-12-01"
    checksum: sha256:4075f10b01a1df36d65d95478432d15d3f08d34aa0706e0bf395e746885371ea
    license: "Maa-amet open data (CC BY 4.0 equivalent, attribution: Maa-amet)"

output:
  path: rivers_clipped.gpkg
  kind: vector
  geometry_type: MultiLineString
  crs: EPSG:4326
  required_fields: [source_fid, name]

evaluation:
  strict:
    crs: exact
    feature_count: exact
    geometry:
      metric: hausdorff_distance
      match: entity
      key: source_fid
      tolerance: 3.0
      comparison_crs: EPSG:3301
      require_valid: true
    attributes:
      key: source_fid
      columns: [source_fid, name]
    vector_checks:
      - {type: unique, field: source_fid}

metadata:
  difficulty: medium
  family: spatial-overlay-and-suitability
  failure_modes: [crs_preservation, geometry_topology, unrecovered_tool_failure]
  skills: [reprojection, geometry-repair, clip, layer-selection]
  source_case: "GISAgentBench (arXiv:2608.01645) case clipping_shoreline_to_boroughs, recast onto Pärnu county rivers"
  paired_task: gab-sosa-002b
  tolerance_rationale: >
    The Hausdorff tolerance of 3 m is set by one measured mechanism: clipping in EPSG:4326
    and reprojecting afterwards, instead of clipping in EPSG:3301, moves a clipped river end
    by up to 1.44 m, because the generalised municipality edges are straight lines in
    whichever CRS the clip runs in. Both routes are defensible, so the contract absorbs the
    difference instead of scoring it. Nothing plausible and wrong lands inside 3 m: an
    unclipped river, a river clipped to the wrong region or a dropped municipality is out by
    hundreds of metres or fails the feature count outright. Geometry is matched per river
    rather than over the union so that a missing or extra river is reported as such.
  reference_method: >
    tools/solve.py clips with an overlay intersection and, independently, by splitting each
    river at the region boundary and keeping the pieces whose midpoint is covered by the
    region; the two must agree on every river to within 1e-6 m in length and Hausdorff
    distance before a reference is written.
  scoring_caveat: >
    On GEOS 3.13 the intersection succeeds even against the two unrepaired polygons and
    returns the same lengths, so the defect is an operational hazard for toolchains that
    validate their input rather than a difference in the numbers. What is scored is the
    other half of the same mistake: dropping the two invalid features instead of repairing
    them changes the clipped length of 282 of the 510 rivers.
