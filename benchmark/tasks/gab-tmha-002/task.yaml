schema_version: "0.1"
id: gab-tmha-002
title: Polygons of steep slope from a DEM
category: vector
prompt: >
  inputs/dem.tif is a Copernicus GLO-30 elevation window over the Haanja upland: 288 x 288
  float32 cells on the EPSG:4326 grid, 1 arcsecond in latitude and 1.5 arcseconds in
  longitude, elevations 87.8 to 230.5 m, no NoData.

  Work on this analysis grid and no other: EPSG:3301, upper-left corner x 670000, y 6407500,
  cell size 10 m, 650 columns and 800 rows, so the extent is 670000 to 676500 east and
  6399500 to 6407500 north. Resample the DEM onto that grid with bilinear interpolation
  first, and compute slope from the resampled grid afterwards. That order matters: slope
  taken on the 30 m grid and resampled afterwards is a different, smoother surface.

  Compute slope in percent with Horn's method, the standard 3 x 3 kernel. The outermost row
  and column of the grid have no complete 3 x 3 window, so they have no slope and cannot
  belong to a steep region. A cell is steep when its slope is 20 % or more. Group steep
  cells into 8-connected regions and discard any region smaller than 0.5 hectares
  (5000 m2).

  Write one polygon per surviving region to steep_slopes.gpkg in EPSG:3301, with the fields
  slope_pct_max, the largest slope among the grid cells whose centre falls inside the
  region, and area_m2, the area of the written geometry. Regions that touch themselves
  diagonally must be written as valid geometry, which makes them multipolygons.

inputs:
  - path: inputs/dem.tif
    role: dem
    source: "Copernicus DEM GLO-30, tile Copernicus_DSM_COG_10_N57_00_E026_00_DEM (https://copernicus-dem-30m.s3.amazonaws.com/), window 26.85/57.70/26.97/57.78 copied unchanged"
    as_of: "2022-05-09"
    checksum: sha256:951b604fd196d365a2bb16d7377d190b837b9b733f44b70ee69b3005d0faf269
    license: "Copernicus DEM, free for any use with attribution (© DLR e.V. 2010-2014 / © Airbus Defence and Space GmbH 2014-2018, provided under COPERNICUS by the European Union and ESA)"

output:
  path: steep_slopes.gpkg
  kind: vector
  geometry_type: MultiPolygon
  crs: EPSG:3301
  required_fields: [slope_pct_max, area_m2]

evaluation:
  strict:
    crs: exact
    feature_count: ignore
    geometry:
      metric: symmetric_difference_ratio
      tolerance: 0.06
      require_valid: true
    vector_checks:
      - {type: field_equals_measure, field: area_m2, measure: area, absolute: 1.0, relative: 0.0001}
      - {type: field_range, field: area_m2, min: 5000}
      - {type: field_range, field: slope_pct_max, min: 20}

metadata:
  difficulty: hard
  family: terrain-modeling-and-hydrology
  failure_modes: [operation_order, crs_misalignment, boundary_ambiguity, connectivity]
  skills: [resampling, slope, thresholding, region-grouping, polygonize]
  source_case: "GISAgentBench (arXiv:2608.01645) case polygonizing_steep_slope_areas, recast onto the Haanja upland"
  paired_task: gab-tmha-002s
  tolerance_rationale: >
    This is the one task in the set whose tolerance is not a rounding budget. Two correct
    implementations of "resample bilinearly, then take Horn's slope" do not agree: GDAL's
    warper and a direct bilinear interpolation at the target cell centres differ by up to
    0.9 m in elevation on this DEM, which moves the 20 % isoline and gives 289 regions over
    754.6 ha against 294 regions over 756.5 ha, a symmetric difference of 0.0376. The
    tolerance of 0.06 is set from that measurement with a small margin, and the reference
    solver refuses to write a reference if the gap ever exceeds 0.05. It still rejects the
    failure the source case is about by a wide margin: computing slope on the 30 m grid and
    resampling the slope afterwards gives 529.0 ha over 224 regions, a symmetric difference
    of 0.4033. Feature count is ignored because region counts are the most fragile number
    here; the 0.5 ha minimum keeps that fragility out of the area. The per-feature
    attributes are checked against the geometry the agent wrote rather than against the
    reference, since regions have no stable key.
  reference_method: >
    tools/solve.py resamples with GDAL's warper and, independently, by interpolating the
    four surrounding DEM cell centres directly with NumPy, then runs the same slope,
    threshold, grouping and filtering on both and measures the disagreement.
  scoring_caveat: >
    The published case failed all six models, but its contract did not state the
    connectivity, the slope kernel or the resampling method, so its reference was one of
    several defensible answers. This contract states all three, and then admits with a 6 %
    tolerance that even a fully specified pipeline is implementation-dependent once a
    resampling step is in it.
